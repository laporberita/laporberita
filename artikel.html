<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b568c">
  <meta name="description" content="Baca berita pendidikan dari LAPOR BERITA.">
  <title>Artikel — LAPOR BERITA</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <style>
    .article-page{max-width:900px;margin:28px auto;padding:clamp(18px,4vw,42px);background:#fff;border-radius:16px}
    .article-page h1{font-size:clamp(2rem,6vw,3.2rem);line-height:1.15;margin:22px 0}
    .article-meta{color:#667085;margin-bottom:24px}
    .article-cover{display:block;width:100%;max-height:520px;object-fit:cover;border-radius:12px;margin:24px 0}
    .article-summary{font-size:1.12rem;line-height:1.7}
    .article-body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.9;font-size:1.05rem}
    .article-media{margin-top:28px}
    .article-media-item{margin:18px 0}
    .article-media img,.article-media video{display:block;max-width:100%;max-height:560px;height:auto;border-radius:10px}
    .article-media a{display:inline-block;margin-top:8px;overflow-wrap:anywhere}
    .article-source{margin-top:28px}
    .article-actions{margin-top:28px;display:flex;gap:12px;flex-wrap:wrap}
    .article-error{padding:18px;background:#eef6ff;border-radius:10px}
  </style>
</head>
<body>
  <header class="masthead">
    <div class="container mastrow">
      <a class="brand" href="index.html" aria-label="Beranda LAPOR BERITA">
        <img src="logo-lapor-berita.jpg" alt="LAPOR BERITA — Media Berita Pendidikan Indonesia" style="display:block;width:100%;max-width:360px;height:auto;object-fit:contain">
      </a>
      <a class="button" href="index.html">Beranda</a>
    </div>
  </header>
  <main class="container">
    <article class="page article-page" id="article" aria-live="polite">
      <p class="muted">Memuat artikel…</p>
    </article>
  </main>
  <footer class="footer">
    <div class="container">LAPOR BERITA · Media Berita Pendidikan Indonesia</div>
  </footer>
  <script>
  (() => {
    'use strict';
    const root = document.getElementById('article');
    const cfg = window.LAPOR_BERITA_CONFIG;
    const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[char]));
    function safeHttpUrl(value) {
      if (typeof value !== 'string' || !value.trim()) return null;
      try {
        const url = new URL(value, window.location.href);
        return ['https:', 'http:'].includes(url.protocol) ? url.href : null;
      } catch (_) { return null; }
    }
    function parseMedia(value) {
      if (Array.isArray(value)) return value.filter(item => typeof item === 'string');
      if (typeof value === 'string' && value.trim()) {
        try {
          const parsed = JSON.parse(value);
          if (Array.isArray(parsed)) return parsed.filter(item => typeof item === 'string');
        } catch (_) {
          if (/^https?:\/\//i.test(value.trim())) return [value.trim()];
        }
      }
      return [];
    }
    function formatDate(value) {
      if (!value) return '';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '';
      return date.toLocaleDateString('id-ID', {day:'numeric', month:'long', year:'numeric'});
    }
    function showError(title, detail) {
      root.innerHTML = '<div class="article-error"><h1>' + esc(title) + '</h1><p>' +
        esc(detail) + '</p><p><a href="index.html">Kembali ke Beranda</a></p></div>';
    }
    // Isi artikel ditampilkan sebagai teks aman, bukan HTML yang dapat menjalankan kode.
    function mediaMarkup(value) {
      return parseMedia(value).slice(0, 10).map((raw, index) => {
        const url = safeHttpUrl(raw);
        if (!url) return '';
        const pathname = new URL(url).pathname.toLowerCase();
        const isVideo = /\.(mp4|webm|ogg|mov|m4v)$/i.test(pathname);
        if (isVideo) {
          return '<div class="article-media-item"><video controls preload="metadata" playsinline src="' + esc(url) +
            '">Browser Anda tidak mendukung pemutar video.</video><p><a href="' + esc(url) +
            '" target="_blank" rel="noopener noreferrer">Buka video di tab baru</a></p></div>';
        }
        return '<div class="article-media-item"><img loading="lazy" src="' + esc(url) +
          '" alt="Media tambahan berita ' + (index + 1) + '"><p><a href="' + esc(url) +
          '" target="_blank" rel="noopener noreferrer">Buka foto di tab baru</a></p></div>';
      }).join('');
    }
    async function init() {
      const id = new URLSearchParams(window.location.search).get('id');
      if (!id) {
        showError('Artikel tidak ditemukan', 'Tautan artikel tidak mencantumkan ID berita.');
        return;
      }
      if (!cfg?.SUPABASE_URL || !cfg?.SUPABASE_PUBLISHABLE_KEY || !window.supabase?.createClient) {
        showError('Halaman belum siap', 'Konfigurasi berita belum termuat. Silakan muat ulang halaman.');
        return;
      }
      try {
        const db = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_PUBLISHABLE_KEY);
        const result = await db.from('articles')
          .select('id,title,slug,summary,body,category_id,image_path,author_label,source_url,status,published_at,created_at,region_type,province,regency,city,media_urls')
          .eq('id', id).eq('status', 'published').maybeSingle();
        if (result.error) throw result.error;
        const article = result.data;
        if (!article) {
          showError('Artikel tidak ditemukan', 'Berita mungkin belum diterbitkan atau tidak tersedia untuk publik.');
          return;
        }
        document.title = (article.title || 'Artikel') + ' — LAPOR BERITA';
        const place = article.city || article.regency || article.province || 'Pendidikan';
        const publishedDate = formatDate(article.published_at);
        const sourceUrl = safeHttpUrl(article.source_url);
        const imageUrl = safeHttpUrl(article.image_path);
        const extraMedia = mediaMarkup(article.media_urls);
        root.innerHTML =
          '<p><a href="index.html">Beranda</a> / <span class="tag">' + esc(place) + '</span></p>' +
          '<h1>' + esc(article.title || 'Tanpa judul') + '</h1>' +
          '<p class="article-meta">' + esc(article.author_label || 'Redaksi LAPOR BERITA') +
          (publishedDate ? ' · ' + esc(publishedDate) : '') + '</p>' +
          (imageUrl ? '<img class="article-cover" src="' + esc(imageUrl) + '" alt="Foto utama berita" fetchpriority="high">' : '') +
          (article.summary ? '<p class="article-summary"><strong>' + esc(article.summary) + '</strong></p>' : '') +
          '<div class="article-body">' + esc(article.body || '') + '</div>' +
          (extraMedia ? '<section class="article-media"><h2>Foto dan Video</h2>' + extraMedia + '</section>' : '') +
          (sourceUrl ? '<p class="notice article-source">Sumber: <a href="' + esc(sourceUrl) +
            '" target="_blank" rel="noopener noreferrer">Baca sumber asli</a></p>' : '') +
          '<div class="article-actions"><button type="button" class="button" id="share-article">Bagikan Berita</button>' +
          '<a class="button secondary" href="index.html">Kembali ke Beranda</a></div>';
        document.getElementById('share-article')?.addEventListener('click', async () => {
          try {
            if (navigator.share) await navigator.share({title:document.title, url:window.location.href});
            else if (navigator.clipboard?.writeText) {
              await navigator.clipboard.writeText(window.location.href);
              alert('Tautan berita berhasil disalin.');
            } else window.prompt('Salin tautan berita ini:', window.location.href);
          } catch (error) {
            if (error?.name !== 'AbortError') window.prompt('Salin tautan berita ini:', window.location.href);
          }
        });
      } catch (error) {
        console.error('Gagal memuat artikel publik:', error);
        showError('Berita gagal dimuat', 'Periksa koneksi internet, lalu muat ulang halaman.');
      }
    }
    init();
  })();
  </script>
</body>
</html>
